# yamaha-cp3-can — signal database
#
# Single source of truth of this repository. The DBC file and the pages under
# docs/messages/ are generated from it (tools/gen_dbc.py, tools/gen_docs.py).
#
# Conventions
#   - Bytes are numbered from 0 (B0 is the first data byte).
#   - Bit 7 is the most significant bit of a byte, bit 0 the least.
#   - Multi-byte values are big-endian unless `endian: little` is given.
#   - value = raw * scale + offset. No scale and no offset means the raw number.
#   - addr forms: { byte, len, endian, signed }  or  { byte, bit, bit_len }
#     where `bit` is the least significant bit of the field.
#   - `dbc: false` marks an alias that reuses the bits of another signal.

meta:
  schema_version: 1
  version: "0.1.0"
  dbc_comment: >-
    Yamaha CP3 (Tracer 9 2021-2024 generation) diagnostic-connector CAN bus, 500 kbit/s,
    11-bit IDs. Generated from data/signals.yaml of github.com/bratukh/yamaha-cp3-can
    (CC BY 4.0). Read from one motorcycle, a 2022 Tracer 9 (RN70, EU). Each signal comment
    starts with [status/confidence]. Read-only use.
  bus:
    bitrate: 500000
    id_bits: 11
    broadcast_ids: 18
    frames_per_second: 1071
  status:
    confirmed: "Agrees with an independent reference (dash, GPS, phone sensors, an OBD-II reading, or a deliberate rider action) and the agreement was reproduced on a second recording. A field that equals a confirmed field in every paired frame on at least two recordings is confirmed as a copy of it, with no higher confidence than the original. A field that never changed is not confirmed; it is unknown."
    hypothesis: "A pattern in the data that fits, without an independent reference yet."
    unknown: "The bits are on the bus; we do not know what they mean."
    ruled_out: "An earlier reading that the data disproved. Kept so nobody repeats it."
  confidence:
    high: "Several rides, a good reference, no counter-examples."
    medium: "One ride or one reference, or a scale known to a few percent only."
    low: "Thin evidence."
  tested_on:
    - model: "Yamaha Tracer 9 (base model)"
      model_code: RN70
      year: 2022
      market: EU (Euro 5)
      engine_ecu_sw: "12165003"
      abs_ecu_sw: "12165180"
      system_name: B5U1
      captured: "2026-04 to 2026-09"

messages:

  0x205:
    name: wheel_speeds
    dlc: 8
    rate_hz: 100
    status: confirmed
    summary: >-
      Front and rear wheel speed as two 16-bit words. The difference between them shows
      wheel slip under traction control and ABS.
    signals:
      - name: wheel_speed_front
        addr: { byte: 0, len: 2, endian: big, signed: false }
        scale: 0.00990099
        unit: km/h
        min: 0
        max: 300
        status: confirmed
        confidence: high
        confirmed_by: "Phone GPS speed on one ride; the dash speedometer on video on two others"
        description: >-
          Front wheel speed, raw / 101.0 = true km/h. The dash reads about 9 % higher than
          this, as most speedometers do.
        evidence: >-
          Compared with phone GPS Doppler speed over one ride: 181 steady pairs from 17 to
          135 km/h give 100.8 raw per km/h, residual sd 0.4 km/h. The ratio falls slightly
          with speed (101.2 at 15-40 km/h, 100.4 above 120 km/h). Two earlier rides compared
          through video of the dash speedometer (linear from 11 to 170 km/h) agree with it.
        caveats: >-
          The scale depends on tyre size, wear and pressure. One GPS ride on one set of tyres.
        example: { frame: "2B 21 2B 78 00 04 00 00", value: 109.3 }
      - name: wheel_speed_rear
        addr: { byte: 2, len: 2, endian: big, signed: false }
        scale: 0.00990099
        unit: km/h
        min: 0
        max: 300
        status: confirmed
        confidence: medium
        confirmed_by: "The front wheel word; the wheel-speed dip at rear ABS events"
        description: >-
          Rear wheel speed, same scale as the front. At steady speed it reads within 0.2 % of
          the front below 60 km/h and up to 1 % higher above 100 km/h.
        evidence: >-
          Rear/front ratio over 2313 steady windows of one ride; when the rear wheel locks,
          the rear word drops 8-10 km/h below the front within a few frames and recovers.
        example: { frame: "2B 21 2B 78 00 04 00 00", value: 110.2 }
      - name: accel_state_bits
        addr: { byte: 5, bit: 0, bit_len: 4 }
        status: hypothesis
        confidence: low
        description: >-
          Four flag bits in the low nibble of B5 (B4 is always 0). Bit 3 is set in 50-73 % of
          frames while accelerating, 4-6 % while decelerating, never with the rear brake pedal
          down, and about 90 % of the time at standstill. Bit 1 goes with hard acceleration,
          bit 2 with moderate acceleration. Looks like a drive or acceleration state. An
          earlier reading of bit 3 as "ABS armed" does not fit.
      - name: b6b7_always_zero
        addr: { byte: 6, len: 2, endian: big, signed: false }
        status: unknown
        description: Always 0x0000 in every full-rate capture and long-ride log.
    derived:
      - name: wheel_slip
        formula: "wheel_speed_rear - wheel_speed_front"
        unit: km/h
        status: confirmed
        confidence: high
        confirmed_by: "Rear ABS events; wheelspin on sand"
        description: >-
          Positive when the rear wheel spins faster than the front (wheelspin on a loose
          surface), negative when the rear slows more than the front (rear lock-up).
        evidence: >-
          Negative by 8-10 km/h at each rear ABS event; positive by 4-9 km/h while the rear
          wheel spun on sand.

  0x209:
    name: engine_gear
    dlc: 6
    rate_hz: 100
    status: confirmed
    summary: >-
      Engine speed, gear position, riding mode and traction-control level in one frame.
    notes:
      - >-
        In the first ~0.55 s after the bus wakes, B4 reads 0x48/0x49 and then 0x08/0x09
        before settling. Ignore the frame until then.
    signals:
      - name: engine_rpm
        addr: { byte: 0, len: 2, endian: big, signed: false }
        scale: 0.390625
        unit: rpm
        min: 0
        max: 12000
        status: confirmed
        confidence: high
        confirmed_by: "OBD-II PID 0x0C on the same bus; the exhaust-note frequency on the camera sound track"
        description: Engine speed, raw × 25/64.
        evidence: >-
          Compared with OBD-II PID 0x0C polled on the same bus: median difference +0.1 %
          over 96 pairs in three sessions, steady pairs within 0.3 %.
        example: { frame: "49 4E 07 66 03 08", value: 7330.5 }
      - name: b2_unknown
        addr: { byte: 2 }
        status: unknown
        description: >-
          Changes with road speed (correlation 0.99 with rear wheel speed over one ride). Not
          decoded.
      - name: gear_actual
        addr: { byte: 3, bit: 5, bit_len: 3 }
        unit: gear
        values: { 0: "neutral", 1: "1st", 2: "2nd", 3: "3rd", 4: "4th", 5: "5th", 6: "6th" }
        status: confirmed
        confidence: high
        confirmed_by: "Published gearbox ratios, through engine speed divided by wheel speed"
        description: >-
          Gear reported by the gearbox sensor. Never reads 7. With the engine stopped it
          reads 0 whatever gear is engaged, so use `gear_requested` for a display.
        evidence: >-
          rpm divided by rear wheel speed gives one constant per gear (about 105.8, 80.1,
          66.7, 56.8, 49.0, 42.7), the same within 0.2 on five rides. Relative to 3rd gear
          that is 1.588, 1.203, 1, 0.853, 0.735, 0.640; the gearbox ratios Yamaha publishes
          (2.571, 1.947, 1.619, 1.381, 1.190, 1.037) give 1.588, 1.203, 1, 0.853, 0.735, 0.641.
        example: { frame: "49 4E 07 66 03 08", value: 3 }
      - name: tcs_level
        addr: { byte: 3, bit: 1, bit_len: 4 }
        values: { 0: "probably TCS OFF (not confirmed)", 1: "TCS 1", 2: "TCS 2", 3: "TCS M (manual)" }
        status: confirmed
        confidence: high
        confirmed_by: "The dash on video with spoken markers, through 0x226 B3"
        description: >-
          Traction-control setting. The same value is repeated in 0x226 B3 and in 0x215.
          Value 0 is probably TCS OFF, which this bike offers, but that is not confirmed:
          it appeared on one ride only, and nobody noted TCS OFF being selected on it. No
          capture has a deliberate switch to OFF yet.
        evidence: >-
          Equal to 0x226 B3 in more than 420 000 paired frames; the only mismatches are the
          first frame after power-on and a one-frame lag at a change. 13 rider-made changes
          covering levels 1, 2 and M.
        example: { frame: "49 4E 07 66 03 08", value: 3 }
      - name: start_flag
        addr: { byte: 3, bit: 0 }
        status: hypothesis
        confidence: medium
        description: >-
          Set while the engine is cranking: in 13 of 13 engine starts it comes on with the
          first cranking frame and clears 0.7-0.9 s later when the engine idles. On some rides
          it is also set for long stretches with the ignition on and the engine off, so the
          exact meaning is open. It is not a shift flag: clear at all 535 gear changes checked.
      - name: gear_requested
        addr: { byte: 4, bit: 0, bit_len: 3 }
        unit: gear
        values: { 0: "neutral", 1: "1st", 2: "2nd", 3: "3rd", 4: "4th", 5: "5th", 6: "6th", 7: "between gears" }
        status: confirmed
        confidence: high
        confirmed_by: "Gear changes on rides; the dash gear indicator with the engine stopped"
        description: >-
          Gear position as the shift mechanism sees it. Reads 7 for a moment during gear
          changes between 2nd and 6th while moving; changes between 1st and 2nd go straight
          from one number to the other. Keeps showing the engaged gear with the engine stopped,
          which is what the dash shows. Mask with 0x07: bit 3 of the byte is a separate flag.
        evidence: >-
          One 43-minute ride: 74 episodes of 7, one per gear change above 2nd, symmetric up
          and down. The same pattern on a second ride at full rate.
        example: { frame: "49 4E 07 66 03 08", value: 3 }
      - name: b4_bit3_unknown
        addr: { byte: 4, bit: 3 }
        status: unknown
        description: >-
          Set for about half a second at every bus wake-up, and for the whole time
          `tcs_level` reads 0 on the one ride where that happened.
      - name: ride_mode
        addr: { byte: 4, bit: 6, bit_len: 2 }
        values: { 0: "D-MODE 1", 1: "D-MODE 2", 2: "D-MODE 3", 3: "D-MODE 4" }
        status: confirmed
        confidence: medium
        confirmed_by: "The dash on video with spoken markers"
        description: >-
          Selected riding mode. The same two bits appear in 0x215 B7 and 0x226 B0.
        evidence: >-
          The rider stepped through the four modes with the dash in the frame in two parked
          sessions; the field followed every step. The three copies agree on every ride.
        example: { frame: "49 4E 07 66 03 08", value: 0 }
      - name: shift_window_bits
        addr: { byte: 5, bit: 2, bit_len: 2 }
        values: { 0: "neither", 1: "bit 2 only", 2: "bit 3 only" }
        status: hypothesis
        confidence: medium
        description: >-
          B5 takes the values 0x00, 0x04 and 0x08. 0x08 goes with an open throttle and 0x04
          with a closed throttle and the clutch engaged, but 0x08 never occurs in 6th gear
          and 0x04 never occurs in 1st. That fits "upshift possible" (bit 3) and "downshift
          possible" (bit 2), the two quickshifter windows, better than a plain drive/overrun
          state. Not checked against the quickshifter arrows on the dash.
        example: { frame: "49 4E 07 66 03 08", value: 2 }

  0x215:
    name: throttle
    dlc: 8
    rate_hz: 100
    status: confirmed
    summary: >-
      Throttle grip position and throttle valve opening as two separate 16-bit words, plus
      copies of the traction-control level and the riding mode.
    signals:
      - name: throttle_valve
        addr: { byte: 0, len: 2, endian: big, signed: false }
        unit: raw
        min: 0
        max: 700
        status: hypothesis
        confidence: medium
        description: >-
          Throttle valve opening: about 14 at idle, 697-698 at the stop. It follows the grip
          most of the time and departs from it where the ECU decides: it stays open with the
          grip closed for minutes at steady speed (cruise control), opens less than the grip
          asks at low rpm, and drops during a quickshift while the grip stays put. No
          independent reference, hence hypothesis.
        example: { frame: "00 95 00 83 03 2B 06 02", value: 149 }
      - name: throttle_grip
        addr: { byte: 2, len: 2, endian: big, signed: false }
        unit: raw
        min: 0
        max: 730
        status: confirmed
        confidence: medium
        confirmed_by: "The mechanical stops of the grip. No independent position reference"
        description: >-
          Throttle grip (twist) position: 0 closed, 690-696 fully open, isolated readings up
          to 730. Percent = raw × 100 / 690, clamped.
        evidence: >-
          The fully open plateau at 690-696 repeats on four rides. `grip_closed` is set in
          every frame where this word is 0.
        example: { frame: "00 95 00 83 03 2B 06 02", value: 131 }
      - name: tcs_level_b4
        addr: { byte: 4, bit: 0, bit_len: 2 }
        status: confirmed
        confidence: medium
        confirmed_by: "Copy of 0x226 `tcs_level`; nothing outside the bus"
        description: "Copy of the traction-control level (see 0x209 `tcs_level`)."
        evidence: "Follows 0x226 B3 through levels 1, 2, M and 0 on full-rate captures and long-ride logs."
      - name: grip_closed
        addr: { byte: 4, bit: 5 }
        status: confirmed
        confidence: medium
        confirmed_by: "Follows `throttle_grip`; nothing outside the bus"
        description: >-
          Set when the grip is closed or nearly closed: in every frame with grip 0, and also
          at grip readings up to about 20.
        evidence: "Four rides, more than 40 000 grip-zero frames, one exception."
      - name: b4_bits67_unknown
        addr: { byte: 4, bit: 6, bit_len: 2 }
        status: unknown
        description: "Takes all four values during a ride, independent of the riding mode. Not decoded."
      - name: tcs_level_b5
        addr: { byte: 5, bit: 0, bit_len: 2 }
        status: confirmed
        confidence: medium
        confirmed_by: "Copy of 0x226 `tcs_level`; nothing outside the bus"
        description: "Another copy of the traction-control level. B5 = 0x28 + level."
        evidence: "Equal to 0x226 B3 in every once-a-second sample of a six-hour ride (22 700 samples), one miss at a change."
      - name: tcs_level_b6
        addr: { byte: 6, bit: 1, bit_len: 2 }
        status: confirmed
        confidence: medium
        confirmed_by: "Copy of 0x226 `tcs_level`; nothing outside the bus"
        description: "Another copy of the traction-control level. B6 = level × 2; bit 7 is set briefly at wake-up."
        evidence: "Same comparison as `tcs_level_b5`."
      - name: ride_mode
        addr: { byte: 7, bit: 6, bit_len: 2 }
        values: { 0: "D-MODE 1", 1: "D-MODE 2", 2: "D-MODE 3", 3: "D-MODE 4" }
        status: confirmed
        confidence: medium
        confirmed_by: "Copy of 0x209 `ride_mode`; nothing outside the bus"
        description: "Copy of the riding mode (see 0x209 `ride_mode`). B7 reads 0x02, 0x42, 0x82 or 0xC2."
        evidence: "Agrees with 0x209 and 0x226 on rides in modes 1, 2 and 3; differs only in the first 0.2 s after wake-up."
        example: { frame: "00 95 00 83 03 2B 06 02", value: 0 }

  0x226:
    name: mode_tcs
    dlc: 7
    rate_hz: 100
    status: confirmed
    summary: >-
      Riding mode and traction-control setting, sent continuously. The value changes only
      when the rider changes a setting.
    notes:
      - "The very first frame after power-on reads `05 01 00 01 00 25 28` whatever the real settings; the real values follow within 10 ms."
      - "B1 is always 0x01; B2, B4 and B6 are 0x00 in normal frames."
    signals:
      - name: ride_mode
        addr: { byte: 0, bit: 6, bit_len: 2 }
        values: { 0: "D-MODE 1", 1: "D-MODE 2", 2: "D-MODE 3", 3: "D-MODE 4" }
        status: confirmed
        confidence: medium
        confirmed_by: "The dash on video with spoken markers"
        description: "Riding mode (see 0x209 `ride_mode`)."
        evidence: "The rider stepped through the four modes with the dash in the frame; this field followed each step."
        example: { frame: "0F 01 00 03 00 2D 00", value: 0 }
      - name: tcs_pattern
        addr: { byte: 0, bit: 0, bit_len: 4 }
        values: { 0: "probably TCS OFF (not confirmed)", 5: "TCS 1", 10: "TCS 2", 15: "TCS M" }
        status: confirmed
        confidence: high
        confirmed_by: "Copy of `tcs_level` in the same frame; nothing outside the bus"
        description: "The 2-bit traction-control level written twice: 0x5, 0xA or 0xF."
        evidence: "Always equal to B3 written twice, in every frame of every capture; one transitional value seen once at a change."
        example: { frame: "0F 01 00 03 00 2D 00", value: 15 }
      - name: tcs_level
        addr: { byte: 3 }
        values: { 0: "probably TCS OFF (not confirmed)", 1: "TCS 1", 2: "TCS 2", 3: "TCS M (manual)" }
        status: confirmed
        confidence: high
        confirmed_by: "The dash on video with spoken markers"
        description: >-
          Traction-control setting. Levels 1 and 2 can be switched while riding with the
          throttle closed; M can be entered or left only at a standstill, and the captures
          agree: every change into or out of M happened at 0 km/h.
        evidence: "12 changes of mode and TCS level in one filmed session, each matched to the value on the dash; 13 TCS changes across all sessions."
        example: { frame: "0F 01 00 03 00 2D 00", value: 3 }
      - name: tcs_level_b5
        addr: { byte: 5, bit: 2, bit_len: 2 }
        status: confirmed
        confidence: high
        confirmed_by: "Copy of `tcs_level` in the same frame; nothing outside the bus"
        description: "Copy of `tcs_level`. B5 = 0x20 + level × 4 + `setting_2bit`, which fits every frame of a 42-minute ride."
        evidence: "The formula fits 253 833 of 253 833 frames of one ride and every frame of three others."
      - name: setting_2bit
        addr: { byte: 5, bit: 0, bit_len: 2 }
        status: hypothesis
        confidence: medium
        description: >-
          A two-bit rider setting that the ABS unit repeats in 0x268 B4 bits 4..3: the two
          are equal in every paired frame. It read 1 in every early capture and 2 in every
          later one, never changing within a session, and it is independent of the TCS
          level. Candidate: brake control mode (BC1 / BC2). Not verified.
        example: { frame: "0F 01 00 03 00 2D 00", value: 1 }

  0x22A:
    name: brake_switch_candidate
    dlc: 2
    rate_hz: 10
    status: hypothesis
    summary: >-
      Two bytes, normally 00 00. One bit follows the rear brake pedal.
    signals:
      - name: brake_switch
        addr: { byte: 1, bit: 3 }
        status: hypothesis
        confidence: medium
        description: >-
          B1 = 0x08 while the rear brake pedal switch (0x268 B4 bit 2) is on: 2209 of 2217
          such frames on one ride, 99.2 % on another. Whether the front lever also sets it
          (which would make it a brake-light signal) is not tested.
      - name: b1_motion_flag
        addr: { byte: 1, bit: 4, bit_len: 4 }
        dbc: false
        status: ruled_out
        description: >-
          An early reading of B1 = 0x50 as "moving" did not hold: B1 stays 0x00 at a sustained
          100 km/h.

  0x22B:
    name: unknown_22b
    dlc: 2
    rate_hz: 10
    status: unknown
    summary: "Always `00 00` in every capture."

  0x22E:
    name: unknown_22e
    dlc: 2
    rate_hz: 10
    status: unknown
    summary: "Always `00 00` in every capture, at standstill and while riding."

  0x23A:
    name: wake_state
    dlc: 3
    rate_hz: 10
    status: hypothesis
    summary: >-
      B0 reads 0x04 for a short time after the bus wakes, then 0x00. B1 and B2 are always
      0xFF.
    signals:
      - name: wake_phase
        addr: { byte: 0 }
        values: { 0: "normal", 4: "just woken" }
        status: hypothesis
        confidence: low
        description: >-
          0x04 from wake-up for anything between 0.1 s and 54 s, back to 0x00 before the
          engine is started, and 0x00 from then on whether the engine runs or not (including
          a 66 s stall). It does not tell a running engine from a stopped one, as we first
          thought. Use `engine_rpm` for that.
        example: { frame: "04 FF FF", value: 4 }

  0x23E:
    name: temperatures
    dlc: 4
    rate_hz: 1
    status: confirmed
    summary: "Coolant temperature, an air temperature and a 16-bit engine-load-like counter, once a second."
    signals:
      - name: coolant_temp
        addr: { byte: 0 }
        scale: 0.625
        offset: -30
        unit: degC
        min: -30
        max: 130
        status: confirmed
        confidence: high
        confirmed_by: "OBD-II PID 0x05 (same ECU); one dash reading on video"
        description: "Engine coolant temperature, raw × 0.625 − 30."
        evidence: >-
          132 pairs with OBD-II PID 0x05 from six sessions, 13 to 98 °C: least-squares fit
          0.6225 × raw − 29.93, and with the rounded 0.625 / −30 the largest error is 1.0 °C
          (the OBD value itself has 1 °C steps). A dash reading of 57 °C matched raw 0x8B
          (56.9 °C).
        example: { frame: "C0 5D 01 4A", value: 90.0 }
      - name: air_temp
        addr: { byte: 1 }
        scale: 1
        offset: -55
        unit: degC
        min: -40
        max: 70
        status: hypothesis
        confidence: low
        description: >-
          An air temperature. raw − 55 gave a believable 13 °C on one cold start, but on
          another cold start it read 32 °C against 24 °C coolant, and it reads 39-44 °C while
          riding on a warm day. Either the sensor sits where the engine heats it (intake air)
          or the scale is wrong. No reference temperature in our captures.
        example: { frame: "C0 5D 01 4A", value: 38 }
      - name: load_counter
        addr: { byte: 2, len: 2, endian: big, signed: false }
        unit: raw
        status: hypothesis
        confidence: low
        description: >-
          0 with the engine off; rises on a cold start and under hard acceleration (peak 878
          on one ride). Probably an injection or torque quantity. Not decoded.

  0x245:
    name: unknown_245
    dlc: 1
    rate_hz: 10
    status: unknown
    summary: "Always `00` in every capture."

  0x250:
    name: imu_accel
    dlc: 8
    rate_hz: 100
    status: confirmed
    summary: >-
      Three-axis accelerometer. Each axis is a 16-bit word with zero at about 7000 and about
      992 counts per g.
    notes:
      - "The first frame after power-up is the reset value `1B 58 1B 58 1F 40 80 00` (7000, 7000, 8000)."
    signals:
      - name: accel_x
        addr: { byte: 0, len: 2, endian: big, signed: false }
        scale: 0.001008
        offset: -7.056
        unit: g
        min: -4
        max: 4
        status: confirmed
        confidence: medium
        confirmed_by: "The derivative of wheel speed; GPS speed change"
        description: >-
          Longitudinal acceleration, (raw − 7000) / 992. Positive when the bike accelerates.
          7000 is the nominal zero (the reset value); this bike reads about 7056 when level
          and at rest, which includes the mounting angle of the sensor.
        evidence: >-
          Correlation 0.97 with the derivative of wheel speed over one ride; sign agrees with
          GPS speed change in 93 % of samples above 0.1 g on another.
        caveats: "The zero is known to about ±20 counts (±0.02 g) and includes the mounting angle of the IMU."
        example: { frame: "1B B6 1B 37 1F CB 20 00", value: 0.095 }
      - name: accel_y
        addr: { byte: 2, len: 2, endian: big, signed: false }
        scale: 0.001008
        offset: -7.056
        unit: g
        min: -4
        max: 4
        status: confirmed
        confidence: medium
        confirmed_by: "An iPhone level (Measure app) fixed above the dash, filmed, bike parked"
        description: >-
          Lateral acceleration in the bike frame, (raw − 7000) / 992. The raw value falls
          when the standing bike is leaned to the left. In a balanced turn the bike leans
          into the resultant force, so this axis stays small: it moves a few counts per
          degree of lean in a corner (our estimates run from 2 to 4) against 17.4 counts per
          degree at standstill.
        evidence: "19 lean angles held at standstill against a phone inclinometer, R² 0.998."
        example: { frame: "1B B6 1B 37 1F CB 20 00", value: -0.033 }
      - name: accel_z
        addr: { byte: 4, len: 2, endian: big, signed: false }
        scale: 0.001008
        offset: -7.056
        unit: g
        min: -4
        max: 4
        status: confirmed
        confidence: medium
        confirmed_by: "Gravity: the magnitude of the three axes at rest"
        description: >-
          Vertical acceleration in the bike frame, (raw − 7000) / 992. About +1 g upright
          and at rest; rises above 1 g in a corner.
        evidence: "Magnitude of the three axes at rest is 991-993 counts on six rides."
        example: { frame: "1B B6 1B 37 1F CB 20 00", value: 1.148 }
      - name: lean_static
        addr: { byte: 2, len: 2, endian: big, signed: false }
        dbc: false
        scale: -0.057412
        offset: 402.59
        unit: deg
        status: confirmed
        confidence: high
        confirmed_by: "An iPhone level (Measure app) fixed above the dash, filmed, bike parked"
        description: >-
          Lean angle of a stationary bike from the lateral axis: (7012.3 − raw) / 17.418.
          Left is positive. Valid at standstill only; for a moving bike see
          docs/lean-reconstruction.md.
        evidence: "Same 19-point standstill calibration as `accel_y`."
      - name: power_up_flags
        addr: { byte: 6 }
        values: { 32: "normal", 96: "first 0.4 s after power-up", 128: "first frame" }
        status: hypothesis
        confidence: medium
        description: >-
          0x80 in the first frame, 0x60 for the next 0.4 s, then 0x20 for the rest of the
          session whether the bike moves or not. An earlier reading of bit 6 as a "moving"
          flag was wrong. B7 is always 0x00.
        example: { frame: "1B B6 1B 37 1F CB 20 00", value: 32 }

  0x254:
    name: imu_gyro
    dlc: 8
    rate_hz: 100
    status: confirmed
    summary: >-
      Three-axis gyroscope. Each axis is a 16-bit word with zero at 30000 and about 100
      counts per degree per second. Yaw rate together with wheel speed gives the lean angle
      in a corner.
    signals:
      - name: roll_rate
        addr: { byte: 0, len: 2, endian: big, signed: false }
        scale: 0.01
        offset: -300
        unit: deg/s
        status: confirmed
        confidence: medium
        confirmed_by: "The accelerometer angle over two side-stand lifts; an iPhone gyro fixed above the dash"
        description: >-
          Roll rate, (raw − 30000) / 100. Positive when the bike rolls to the right. Peaks
          when flicking from one side to the other, near zero in a steady corner.
        evidence: >-
          Two lifts off the side stand (14-15° measured on the accelerometer against the
          integrated rate) give 96.5 and 97.9 counts per °/s; a phone gyroscope fixed above the dash
          gives 105-107. So 100 within about 7 %.
        example: { frame: "74 A8 74 02 76 30 D8 D8", value: -1.36 }
      - name: pitch_rate
        addr: { byte: 2, len: 2, endian: big, signed: false }
        scale: 0.01
        offset: -300
        unit: deg/s
        status: hypothesis
        confidence: medium
        description: >-
          Pitch rate, (raw − 30000) / 100. Large under braking dive. In a steady corner it
          shows a steady offset equal to −yaw × tan(lean), which is the turn seen from a
          leaned sensor and not cross-talk. Hypothesis because nothing outside the IMU was
          compared with this axis: its scale is inferred from the yaw axis.
        evidence: >-
          With lean taken from the reconstruction, the corner offset follows
          −yaw × tan(lean) with a slope between 0.98 and 1.07 on two rides and two sample
          captures. That ties the pitch scale to the yaw scale within about 7 %, assuming
          the reconstruction is right.
        caveats: "Scale not measured directly. Sign under braking not verified."
        example: { frame: "74 A8 74 02 76 30 D8 D8", value: -3.02 }
      - name: yaw_rate
        addr: { byte: 4, len: 2, endian: big, signed: false }
        scale: 0.01
        offset: -300
        unit: deg/s
        status: confirmed
        confidence: medium
        confirmed_by: "Phone GPS heading over whole turns"
        description: >-
          Yaw rate, (raw − 30000) / 100. Positive in a left turn.
        evidence: >-
          Against GPS heading over 15 whole turns of 30-71°: 99.2-99.7 counts per °/s. Sign
          agrees with the GPS course rate in 98 % of samples above 5 °/s and in 15 of 15
          turns.
        example: { frame: "74 A8 74 02 76 30 D8 D8", value: 2.56 }
      - name: b6_unknown
        addr: { byte: 6 }
        status: unknown
        description: >-
          B6 and B7 are always equal. The value drifts slowly; it is not a rolling counter
          and not a sum or XOR of the other bytes.
    derived:
      - name: lean_angle
        formula: "atan((yaw_raw - 30000) * v / 45873), v = wheel_speed_front in m/s"
        unit: deg
        status: confirmed
        confidence: medium
        confirmed_by: "An iPhone's attitude (Sensor Logger app), fixed above the dash, one ride"
        description: >-
          Lean angle in a corner, positive to the left. The bus carries no lean angle; this
          reconstructs it from yaw rate and speed. Compared with a phone fixed above the dash in
          steady corners (8-30° lean, 30-120 km/h): slope 0.99, residual sd 2.8°. Reads about
          13 % low below 30 km/h and overshoots by about 9 % in fast transitions. Not
          validated above 30° of steady lean. Method and limits: docs/lean-reconstruction.md.
        evidence: >-
          197 s of steady corners on one ride against a phone's attitude recorded at 50 Hz;
          the bike's own pitch gyro gives a second, phone-free estimate that reads 5-10 %
          higher.

  0x258:
    name: imu_derived
    dlc: 8
    rate_hz: 100
    status: hypothesis
    summary: >-
      A second IMU frame with packed fields. One word behaves like a pitch rate with the
      cornering component removed, which suggests the IMU computes its own attitude; the
      rest is not decoded.
    signals:
      - name: b0b3_unknown
        addr: { byte: 0, len: 4, endian: big, signed: false }
        status: unknown
        description: >-
          Packed fields. The low nibble of B0 takes only the values 1 and 2 and leans toward
          1 in left-hand corners; the low nibble of B2 steps with lean angle modulo 16. No
          plain 8- or 16-bit lean value was found in a bit-level search.
      - name: b4b5_always_zero
        addr: { byte: 4, len: 2, endian: big, signed: false }
        status: unknown
        description: "Always 0x0000 (311 000 frames of three full-rate captures)."
      - name: pitch_rate_level
        addr: { byte: 6, len: 2, endian: big, signed: false }
        scale: 0.01
        offset: -300
        unit: deg/s
        status: hypothesis
        confidence: medium
        description: >-
          Zero at 30000-30004. Follows the 0x254 pitch rate with the −yaw × tan(lean) corner
          term removed, one frame later (correlation 0.94-0.98 on three rides against 0.52
          for the raw pitch rate). Reads as the pitch rate in the road frame.

  0x25C:
    name: imu_unknown
    dlc: 4
    rate_hz: 100
    status: unknown
    summary: >-
      Not decoded. B0 takes many values (16 seen) and B1 about a dozen (0x11-0x1C). The low
      nibbles of B2 and B3 are always 0xB while the high nibbles vary. No correlation with
      lean, yaw or roll above 0.24.

  0x260:
    name: brake_pressure
    dlc: 8
    rate_hz: 100
    status: confirmed
    summary: "Front brake hydraulic pressure as a 16-bit word, sent twice in the frame."
    notes:
      - "B4:B5 repeat B0:B1 exactly (no mismatch in 400 000 frames). B2:B3 and B6:B7 are always 0."
    signals:
      - name: brake_pressure_front
        addr: { byte: 0, len: 2, endian: big, signed: false }
        unit: raw
        min: 0
        max: 2000
        status: confirmed
        confidence: high
        confirmed_by: "The rider's announced lever use; coincidence with front ABS and front-wheel deceleration. No pressure gauge"
        description: >-
          Front brake pressure in raw units. 0 with the lever released (small values of 1-6
          also occur at rest). Normal riding stays under about 160; hard stops reach
          200-840; a full squeeze at standstill reached 1361. The rear pedal does not
          register here: the word stays 0 in more than 1000 frames where only the rear pedal
          switch is on. The physical unit is not known.
        evidence: >-
          Rises and falls with front lever use; hard stops with pressure above 760 coincide
          with front ABS activity and front wheel deceleration.
        example: { frame: "01 06 00 00 01 06 00 00", value: 262 }

  0x268:
    name: abs_status
    dlc: 6
    rate_hz: 100
    status: confirmed
    summary: >-
      A second speed value from the ABS unit, ABS intervention flags and the rear brake
      pedal switch.
    notes:
      - "B0 and B5 are always 0."
    signals:
      - name: not_moved_since_start
        addr: { byte: 1, bit: 0 }
        status: hypothesis
        confidence: medium
        description: >-
          1 from power-on until the speed first passes about 6 km/h, then 0 through every
          later stop of the ride, and 1 again only in the last 0.2 s before the bus goes
          quiet. Possibly "ABS self-check not yet done". An earlier reading as a low-speed
          indicator was wrong.
      - name: vehicle_speed
        addr: { byte: 2, len: 2, endian: big, signed: false }
        scale: 0.056497
        unit: km/h
        min: 0
        max: 300
        status: confirmed
        confidence: medium
        confirmed_by: "Copy of 0x205 `wheel_speed_front` at a different scale; nothing outside the bus"
        description: >-
          Speed as one 16-bit word, raw / 17.7 = true km/h. It follows the front wheel and
          lags 0x205 by about 20 ms. 0x205 has 5.7 times the resolution, so prefer it.
        evidence: >-
          Ratio to the 0x205 front wheel word is 0.1757 (5th-95th percentile 0.1733-0.1770)
          over 190 000 frames, the same on rides months apart. The scale is tied to 0x205,
          not measured against GPS on its own.
        caveats: >-
          Reading B2 alone as a coarse speed step (B2 × 50/3) over-reads by about 15 %.
        example: { frame: "00 00 07 74 08 00", value: 107.8 }
      - name: abs_rear_active
        addr: { byte: 4, bit: 0 }
        status: confirmed
        confidence: high
        confirmed_by: "The rear wheel-speed dip at each event; rear-brake stops announced by the rider"
        description: >-
          Rear ABS is intervening. Also set when the rear wheel slows sharply from engine
          braking on a downshift with no brake applied.
        evidence: >-
          A controlled rear-brake-only stop; an event called by the rider on video; three
          more on a long ride. In each the rear wheel word drops 4-10 km/h below the front
          within a few frames and the flag then stays on for about half a second.
        example: { frame: "00 00 04 28 09 00", value: 1 }
      - name: abs_front_active
        addr: { byte: 4, bit: 1 }
        status: confirmed
        confidence: medium
        confirmed_by: "The rider's call and audible pulsing during deliberate hard stops; brake pressure; front wheel deceleration"
        description: "Front ABS is intervening."
        evidence: >-
          Three events in total: two deliberate hard stops on one ride, with brake pressure
          765-839, where the rider called the ABS pulse on video, and one lighter event on
          another ride. Thin, but consistent.
      - name: rear_brake_pedal
        addr: { byte: 4, bit: 2 }
        status: confirmed
        confidence: medium
        confirmed_by: "The rider's announced pedal presses"
        description: "Rear brake pedal switch."
        evidence: "Matches deliberate pedal presses at standstill; 120 presses on two rides."
      - name: setting_2bit
        addr: { byte: 4, bit: 3, bit_len: 2 }
        status: hypothesis
        confidence: medium
        description: >-
          Copy of 0x226 `setting_2bit` (equal in every paired frame). Bit 3 was once read as
          "ABS enabled" because it was always 1 in the early captures.

  0x401:
    name: shutdown_state
    dlc: 1
    rate_hz: 10
    status: hypothesis
    summary: >-
      0x00 while the bus is alive. 0x80 after the ignition is switched off, for at least
      half a minute while every other ID has already stopped.
    signals:
      - name: after_run
        addr: { byte: 0, bit: 7 }
        status: hypothesis
        confidence: medium
        description: >-
          0 for the whole ride, engine running or not. 1 only once the rest of the bus has
          gone quiet: at least 31 s of this frame alone at the end of one capture (the capture
          ends first). The sender stays
          awake for a while after key-off and says so. An earlier reading (0x80 = engine
          running) was the wrong way round.
        example: { frame: "00", value: 0 }

  0x590:
    name: unknown_590
    dlc: 4
    rate_hz: 10
    status: unknown
    summary: "Always `00 00 00 00` in every capture."

obd2:
  request_id: 0x7DF
  response_id: 0x7E8
  supported_masks:
    - { pid: 0x00, data: "BE 3E B0 11" }
    - { pid: 0x20, data: "80 00 20 01" }
    - { pid: 0x40, data: "CA C8 00 41" }
    - { pid: 0x60, data: "08 00 00 00" }
  pids:
    - { pid: 0x04, name: "Calculated engine load", unit: "%", formula: "A × 100 / 255", status: confirmed, confidence: medium, example: { data: "43", value: 26.3 } }
    - { pid: 0x05, name: "Coolant temperature", unit: degC, formula: "A − 40", status: confirmed, confidence: high, example: { data: "5D", value: 53 } }
    - { pid: 0x06, name: "Short-term fuel trim", unit: "%", formula: "(A − 128) × 100 / 128", status: confirmed, confidence: medium, example: { data: "7F 00", value: -0.8 }, note: "Two data bytes are returned; the second is not understood." }
    - { pid: 0x07, name: "Long-term fuel trim", unit: "%", formula: "(A − 128) × 100 / 128", status: confirmed, confidence: medium, example: { data: "7F 00", value: -0.8 }, note: "Two data bytes are returned; the second is not understood." }
    - { pid: 0x0B, name: "Intake manifold pressure", unit: kPa, formula: "A", status: confirmed, confidence: medium, example: { data: "44", value: 68 } }
    - { pid: 0x0C, name: "Engine speed", unit: rpm, formula: "(256 × A + B) / 4", status: confirmed, confidence: high, example: { data: "17 0D", value: 1475.25 } }
    - { pid: 0x0D, name: "Vehicle speed", unit: km/h, formula: "A", status: confirmed, confidence: medium, example: { data: "0E", value: 14 } }
    - { pid: 0x0E, name: "Timing advance", unit: deg, formula: "A / 2 − 64", status: confirmed, confidence: medium, example: { data: "8A", value: 5 } }
    - { pid: 0x0F, name: "Intake air temperature", unit: degC, formula: "A − 40", status: confirmed, confidence: medium, example: { data: "36", value: 14 } }
    - { pid: 0x11, name: "Throttle position", unit: "%", formula: "A × 100 / 255", status: confirmed, confidence: medium, example: { data: "25", value: 14.5 } }
    - { pid: 0x14, name: "Oxygen sensor 1 voltage", unit: V, formula: "A / 200", status: confirmed, confidence: medium, example: { data: "3E 80", value: 0.31 } }
    - { pid: 0x1C, name: "OBD standard", unit: "", formula: "A", status: hypothesis, confidence: low, example: { data: "25", value: 37 }, note: "Returns 0x25. We have not tied that code to a named standard." }
    - { pid: 0x33, name: "Barometric pressure", unit: kPa, formula: "A", status: confirmed, confidence: medium, example: { data: "63", value: 99 } }
    - { pid: 0x42, name: "Control module voltage", unit: V, formula: "(256 × A + B) / 1000", status: confirmed, confidence: medium, example: { data: "37 3C", value: 14.14 }, note: "Reads 0.000 with the engine off." }
    - { pid: 0x45, name: "Relative throttle position", unit: "%", formula: "A × 100 / 255", status: confirmed, confidence: medium, example: { data: "05", value: 2.0 } }
    - { pid: 0x47, name: "Absolute throttle position B", unit: "%", formula: "A × 100 / 255", status: confirmed, confidence: medium, example: { data: "22", value: 13.3 } }
    - { pid: 0x49, name: "Accelerator position D", unit: "%", formula: "A × 100 / 255", status: confirmed, confidence: medium, example: { data: "20", value: 12.5 } }
    - { pid: 0x4A, name: "Accelerator position E", unit: "%", formula: "A × 100 / 255", status: confirmed, confidence: medium, example: { data: "20", value: 12.5 } }
    - { pid: 0x4D, name: "Run time with MIL on", unit: min, formula: "256 × A + B", status: confirmed, confidence: medium, example: { data: "00 00", value: 0 } }
    - { pid: 0x5A, name: "Relative accelerator position", unit: "%", formula: "A × 100 / 255", status: hypothesis, confidence: low, note: "Declared and answered; the value was not checked against anything." }
    - { pid: 0x65, name: "Auxiliary input / output", unit: "", formula: "bit field", status: unknown, note: "Declared and answered; bits not decoded." }
    - { pid: 0x2F, name: "Fuel level", unit: "%", formula: "", status: ruled_out, note: "Not declared. Answered NRC 0x12 on the first sessions and nothing on later ones." }
    - { pid: 0xA6, name: "Odometer", unit: km, formula: "", status: ruled_out, note: "Not declared. Answered NRC 0x12 on the first sessions and nothing on later ones." }
  mode09:
    - { pid: 0x04, name: "Calibration ID", status: confirmed, confidence: high, note: "Returns the ASCII string 12165003, the same number as UDS DID 0xF194." }
    - { pid: 0x06, name: "Calibration verification number", status: confirmed, confidence: high, note: "Returns 06 90 FF FF after several NRC 0x78 (response pending) frames, 3-4 s in total." }
    - { pid: 0x0A, name: "ECU name", status: confirmed, confidence: high, note: "Returns ECM, a zero byte, then -EngineControl." }
    - { pid: 0x08, name: "In-use performance tracking", status: hypothesis, confidence: low, note: "Declared; 43 bytes returned, not decoded." }
    - { pid: 0x02, name: "VIN", status: ruled_out, note: "Not declared in mode 09. The VIN is available as UDS DID 0xF190." }
    - { pid: 0x15, name: "InfoType 0x15", status: unknown, note: "Declared in the mask, but the request timed out on most sessions." }

uds:
  note: >-
    Read-only requests only: 0x22 ReadDataByIdentifier in the default (0x10 01) and
    extended (0x10 03) sessions, with 0x3E TesterPresent. No security access was attempted.
  ecus:
    - { request: 0x7E0, response: 0x7E8, name: "Engine ECU", status: confirmed, confidence: high, note: "Supplier ID reads DEN." }
    - { request: 0x7E3, response: 0x7EB, name: "ABS unit", status: confirmed, confidence: high, note: "Supplier ID reads BOSC." }
    - { request: 0x7E6, response: 0x7EE, name: "Unidentified", status: hypothesis, confidence: low, note: "Answered a functional 0x7DF session request (02 50 01). Never addressed directly." }
    - { request: 0x740, response: 0x760, name: "Unidentified, locked", status: hypothesis, confidence: low, note: "Answers a default-session request with NRC 0x33 securityAccessDenied. Response offset is +0x20, not the usual +8." }
  silent: [0x7E1, 0x7E2, 0x7E4, 0x7E5]
  not_probed: [0x7E7]
  dids:
    - { ecu: 0x7E0, did: 0xF190, name: "VIN", status: confirmed, confidence: high, note: "17 ASCII characters, multi-frame." }
    - { ecu: 0x7E0, did: 0xF18A, name: "System supplier", status: confirmed, confidence: high, note: "44 45 4E 00 = DEN." }
    - { ecu: 0x7E0, did: 0xF18C, name: "ECU serial number", status: confirmed, confidence: high, note: "FF FF FF FF (not provided)." }
    - { ecu: 0x7E0, did: 0xF192, name: "Hardware number", status: confirmed, confidence: high, note: "FF FF FF FF (not provided)." }
    - { ecu: 0x7E0, did: 0xF194, name: "Software number", status: confirmed, confidence: high, note: "12 16 50 03, BCD for 12165003; matches OBD mode 09 CalID." }
    - { ecu: 0x7E0, did: 0xF195, name: "Software version", status: confirmed, confidence: high, note: "03." }
    - { ecu: 0x7E0, did: 0xF197, name: "System name", status: confirmed, confidence: high, note: "42 35 55 31 = B5U1." }
    - { ecu: 0x7E0, did: 0xF1A0, name: "Manufacturer-specific", status: unknown, note: "0C 01 00 05; the ABS unit answers 0C 01 00 02." }
    - { ecu: 0x7E0, did: 0xF1A1, name: "Ignition-on time", status: confirmed, confidence: high, note: "32-bit count of seconds with the ignition on. Rose by 85 in the 84.3 s between two reads." }
    - { ecu: 0x7E0, did: 0xF1A2, name: "Slow counter", status: hypothesis, confidence: low, note: "16-bit. Constant within a session and a few counts higher on later days; possibly ignition cycles." }
    - { ecu: 0x7E0, did: 0xF1EF, name: "Unknown", status: unknown, note: "00 00." }
    - { ecu: 0x7E0, did: 0xF198, name: "Unknown", status: unknown, note: "NRC 0x22 conditionsNotCorrect in both sessions." }
    - { ecu: 0x7E0, did: 0xF199, name: "Unknown", status: unknown, note: "NRC 0x22 conditionsNotCorrect in both sessions." }
    - { ecu: 0x7E3, did: 0xF18A, name: "System supplier", status: confirmed, confidence: high, note: "42 4F 53 43 = BOSC." }
    - { ecu: 0x7E3, did: 0xF18C, name: "ECU serial number", status: confirmed, confidence: high, note: "00 00 00 00." }
    - { ecu: 0x7E3, did: 0xF192, name: "Hardware number", status: confirmed, confidence: high, note: "00 00 00 00." }
    - { ecu: 0x7E3, did: 0xF194, name: "Software number", status: confirmed, confidence: high, note: "12 16 51 80." }
    - { ecu: 0x7E3, did: 0xF195, name: "Software version", status: confirmed, confidence: high, note: "00." }
    - { ecu: 0x7E3, did: 0xF197, name: "System name", status: confirmed, confidence: high, note: "42 35 55 31 = B5U1, the same string as the engine ECU." }
    - { ecu: 0x7E3, did: 0xF1A0, name: "Manufacturer-specific", status: unknown, note: "0C 01 00 02." }
  swept: "0xF180-0xF1FF, 0x2000-0x23E7, 0xF000-0xF0FF and 0xFD00-0xFDFF on both ECUs, 1640 identifiers each. Everything not listed above answered NRC 0x12."

open_questions:
  - title: "Where is the odometer?"
    text: >-
      Not found. None of the 18 broadcast IDs carries a distance counter, and neither the
      engine ECU nor the ABS unit returns the dash mileage on any identifier we swept. The
      instrument cluster most likely keeps it, and the cluster did not answer on any
      standard address.
    how_to_close: >-
      Not known. Passive ideas first: log while the dash menu shows the odometer and trip
      meters, and compare the idle bus with the cluster unplugged. We do not recommend sending
      requests to the unidentified units; anything sent must stay inside the read-only list
      in DISCLAIMER.md, with the bike parked and the engine off.
  - title: "Is there an oil temperature?"
    text: "Not on the broadcast frames. OBD-II PID 0x5C is not declared in the supported-PID masks and was never requested."
    how_to_close: "One PID 0x5C request on a warm engine."
  - title: "Does a listen-only node see traffic?"
    text: >-
      Every capture here was made with a node that acknowledges frames. Some diagnostic
      connectors carry traffic only while something acknowledges it. We have not tried
      listen-only mode on the Tracer 9.
    how_to_close: "Connect a transceiver in listen-only (silent) mode with the ignition on and count frames."
  - title: "What is `setting_2bit`?"
    text: "A two-bit setting sent by both the engine ECU (0x226) and the ABS unit (0x268). Brake control mode is the candidate."
    how_to_close: "Switch BC1/BC2 with the bike parked while logging, then do the same for every other menu setting."
  - title: "What do the 0x209 B5 bits mean?"
    text: "They fit quickshifter up and down availability, see `shift_window_bits`."
    how_to_close: "Video of the dash quickshifter arrows together with a full-rate log."
  - title: "Traction control intervention and TCS OFF"
    text: >-
      Wheel slip is visible in 0x205, but no flag that says "traction control is cutting
      power now" has been found. Level 0 is probably TCS OFF but has not been confirmed with a
      deliberate switch during a capture.
    how_to_close: "Select TCS OFF at standstill while logging; provoke TCS on a loose surface with video of the dash light."
  - title: "Cruise control"
    text: "The throttle valve stays open with the grip closed during what must be cruise control, but no cruise state or set-speed field has been identified. 0x215 B4 bits 7..6 are a candidate."
    how_to_close: "Switch cruise on, set, change the set speed and cancel while logging."
  - title: "Gyro roll and pitch scale, IMU frames 0x258 and 0x25C"
    text: "Roll and pitch scales are known to 5-7 % only. 0x258 B0:B3 and all of 0x25C are not decoded; they may hold the IMU's own attitude estimate."
    how_to_close: "A ride with a rigidly mounted reference IMU, including braking and slow lean sweeps."
  - title: "Other models"
    text: "Everything here comes from one 2022 base-model Tracer 9. Other Tracer 9s of any trim, year or market, the MT-09, the XSR900 and the Niken GT of the same generation probably share most of it. A second base Tracer 9 would show whether the data holds beyond one bike; the GT models have extra systems (semi-active suspension, radar on the GT+) that should add frames."
    how_to_close: "A 60-second idle capture from any of those bikes, with the model, year and market."
